name = "why-academy"
main = "index.js"
compatibility_date = "2025-09-01"

# scripts/build-site.mjs copies the public files (an allowlist) into dist/.
# It runs before every deploy and on file changes during `wrangler dev`.
[build]
command = "node scripts/build-site.mjs"
watch_dir = ["../index.html", "../lesson.html", "../playground.html", "../rootlock.html", "../app.js", "../playground.js", "../rootlock.js", "../style.css", "../rootlock.css", "../lib", "../lessons"]

# Only /api/* invokes the Worker; everything else is served straight from assets.
[assets]
directory = "../dist"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# D1: users, sessions, synced settings.
# Run: wrangler d1 create why-academy
# Then paste the database_id below and apply migrations.
[[d1_databases]]
binding = "DB"
database_name = "why-academy"
database_id = "c3492fdb-76de-4faa-a4d1-4200ffb44934"
migrations_dir = "migrations"

# KV namespace for the feedback rate limit (per-account counter with TTL)
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "6efdec4d16244539924c2011532e8721"

# Passkey requests (options + verify) per client IP
[[ratelimits]]
name = "AUTH_LIMITER"
namespace_id = "1001"
  [ratelimits.simple]
  limit = 20
  period = 60

# Settings writes per user
[[ratelimits]]
name = "API_LIMITER"
namespace_id = "1002"
  [ratelimits.simple]
  limit = 60
  period = 60

# Daily cleanup of expired sessions
[triggers]
crons = ["17 4 * * *"]

# Public vars (not secrets)
[vars]
GITHUB_REPO = "vgainullin/why-academy"
RATE_LIMIT_PER_HOUR = "20"
# Account ids allowed to submit feedback (comma-separated). An account's id
# is shown by GET /api/me.
ALLOWED_USERS = ""

# Secrets (set with `wrangler secret put NAME`):
#   GITHUB_TOKEN     - fine-grained PAT scoped to vgainullin/why-academy
